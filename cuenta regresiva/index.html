<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cuenta Regresiva</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>⏳ Cuenta Regresiva</h1>

        <p class="descripcion">
            Selecciona la fecha y hora de tu evento
        </p>

        <input type="datetime-local" id="fechaEvento">

        <div class="botones">

            <button id="iniciar">
                Iniciar
            </button>

            <button id="detener">
                Detener
            </button>

        </div>

        <div class="contador">

            <div class="tiempo">
                <span id="dias">00</span>
                <small>Días</small>
            </div>

            <div class="tiempo">
                <span id="horas">00</span>
                <small>Horas</small>
            </div>

            <div class="tiempo">
                <span id="minutos">00</span>
                <small>Minutos</small>
            </div>

            <div class="tiempo">
                <span id="segundos">00</span>
                <small>Segundos</small>
            </div>

        </div>

        <div id="mensaje"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
